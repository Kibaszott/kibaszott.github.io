<!DOCTYPE html>productive
<html lang="en">

<head>
    <!--
    ============================================================
    BASIC WEBSITE INFORMATION
    ============================================================
    -->

    <!-- Allows normal letters, punctuation and special characters -->
    <meta charset="UTF-8">

    <!-- Makes the website resize correctly on phones and tablets -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <!--
    This is the title shown on the browser tab.

    Change only the words between <title> and </title>.
    -->
    <title>Mathew's Personal Website</title>

    <!--
    This short description may be used by search engines.
    Change the sentence inside content="...".
    -->
    <meta
        name="description"
        content="A personal website for blog posts, short stories, writings and miscellaneous work."
    >

    <style>
        /*
        Loads Roboto from Google Fonts for the website body, menu,
        page content and footer. The top banner title keeps Arial.
        */
        @ifport url("https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap");

        /*
        ============================================================
        COLOUR SETTINGS
        ============================================================

        These variables make it easier to change the entire colour
        scheme later.

        For now, the website uses black and white.

        Example:
        --background-colour: white;
        --text-colour: black;
        */

        :root {
            --background-colour: #ffffff;
            --text-colour: #000000;
            --banner-colour: #36465E;
            --banner-text-colour: #ffffff;
            --border-colour: #36465E;
            --subtle-border-colour: #d6d6d6;

            /*
            Change this number to make the top banner taller
            or shorter on desktop.
            */
            --banner-height: 80px;

            /*
            Change this number to make the top banner taller
            or shorter on phones.
            */
            --mobile-banner-height: 65px;

            /*
            Decorative motif image used beneath the banner
            and behind the footer.

            Upload the chosen image later as:
            images/motif-image.jpg
            */
            --motif-image: url("images/motif-image.jpg");
            --motif-strip-height: 10px;
            --mobile-motif-strip-height: 8px;
            --footer-motif-height: 100px;
        }


        /*
        ============================================================
        GENERAL WEBSITE SETTINGS
        ============================================================
        */

        /*
        Makes width and height calculations more predictable.
        You generally do not need to change this.
        */
        * {
            box-sizing: border-box;
        }

        /*
        Makes menu links scroll smoothly to sections.
        */
        html {
            scroll-behavior: smooth;
        }

        body {
            /*
            Removes the default space around the outside
            of the webpage.
            */
            margin: 0;

            /* Main page colours */
            background-color: var(--background-colour);
            color: var(--text-colour);

            /*
            Main website font.

            Other simple options:

            Georgia, "Times New Roman", serif;
            Verdana, Arial, sans-serif;
            */
            font-family: "Roboto", Arial, Helvetica, sans-serif;

            /*
            Makes normal text easier to read.
            */
            line-height: 1.6;
        }

        /*
        Gives keyboard users a visible outline when they
        select buttons or links.
        */
        /*
        Removes underlines from every link across the entire website.
        */
        a {
            text-decoration: none;
        }

        a:focus-visible,
        button:focus-visible {
            outline: 3px solid currentColor;
            outline-offset: 3px;
        }

        /*
        Prevents images from extending beyond the page width.
        */
        img {
            max-width: 100%;
        }


        /*
        ============================================================
        FIXED TOP BANNER
        ============================================================
        */

        .top-banner {
            /*
            Keeps the banner visible while the page scrolls.
            */
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: var(--banner-height);

            background-color: var(--banner-colour);
            color: var(--banner-text-colour);

            /*
            Centres the website title inside the banner.
            */
            display: flex;
            align-items: center;
            justify-content: center;

            /*
            Keeps the banner above the rest of the page.
            */
            z-index: 1000;

            border-bottom: 1px solid var(--banner-text-colour);
        }

        /*
        Thin decorative strip fixed beneath the black banner.
        */
        .motif-strip {
            position: fixed;
            top: var(--banner-height);
            left: 0;

            width: 100%;
            height: var(--motif-strip-height);

            background-image: var(--motif-image);
            background-size: cover;
            background-position: center;

            z-index: 999;
        }

        .site-title {
            margin: 0;

            /*
            Keeps the top banner title in its original font.
            */
            font-family: Arial, Helvetica, sans-serif;

            /*
            Change this number to make the banner title
            larger or smaller.
            */
            font-size: 24px;

            font-weight: normal;

            /*
            Controls spacing between letters.
            */
            letter-spacing: 3px;

            /*
            Delete this line if you do not want the title
            automatically displayed in uppercase.
            */
            text-transform: uppercase;

            /*
            Stops the title from sitting underneath the menu button
            on smaller screens.
            */
            padding: 0 90px;

            text-align: center;
        }

        /*
        This makes the banner title act as a Home link.
        */
        .site-title a {
            color: inherit;
            text-decoration: none;
        }


        /*
        ============================================================
        HAMBURGER MENU
        ============================================================
        */

        .menu {
            position: absolute;
            top: 0;
            left: 0;

            height: var(--banner-height);
        }

        .menu-button {
            /*
            Size of the clickable hamburger area.
            */
            width: var(--banner-height);
            height: var(--banner-height);

            padding: 0;

            background-color: var(--banner-colour);
            color: var(--banner-text-colour);

            border: 0;
            cursor: pointer;

            /*
            Arranges the three hamburger lines vertically.
            */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            /*
            Space between the three lines.
            */
            gap: 7px;
        }

        /*
        These are the three lines inside the hamburger icon.
        */
        .menu-button span {
            display: block;

            /*
            Change width to make the lines longer or shorter.
            */
            width: 30px;

            /*
            Change height to make the lines thicker or thinner.
            */
            height: 2px;

            background-color: currentColor;

            transition:
                transform 0.25s ease,
                opacity 0.25s ease;
        }

        /*
        When the menu is open, the three lines change into an X.
        */
        .menu.is-open .menu-button span:nth-child(1) {
            transform: translateY(9px) rotate(45deg);
        }

        .menu.is-open .menu-button span:nth-child(2) {
            opacity: 0;
        }

        .menu.is-open .menu-button span:nth-child(3) {
            transform: translateY(-9px) rotate(-45deg);
        }


        /*
        ============================================================
        DROPDOWN MENU
        ============================================================
        */

        .dropdown {
            position: absolute;

            /*
            Starts directly underneath the fixed banner.
            */
            top: var(--banner-height);
            left: 0;

            /*
            Change this number to make the menu wider or narrower.
            */
            width: 230px;

            margin: 0;
            padding: 0;

            list-style: none;

            background-color: white;
            border-top: 1px solid var(--banner-colour);
            border-right: 1px solid var(--banner-colour);
            border-bottom: 1px solid var(--banner-colour);

            /*
            These settings hide the dropdown when it is closed.
            */
            opacity: 0;
            visibility: hidden;
            pointer-events: none;

            transform: translateY(-6px);

            transition:
             opacity 0.45s ease,
            visibility 0.45s ease,
            transform 0.45s ease;
        }

        /*
        The menu opens in three situations:

        1. The mouse hovers over it on a desktop computer.
        2. A keyboard user focuses inside it.
        3. JavaScript adds the class "is-open" after a click or tap.
        */
        .menu:hover .dropdown,
        .menu:focus-within .dropdown,
        .menu.is-open .dropdown {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;

            transform: translateY(0);
        }

        .dropdown a {
            display: block;

            /*
            Dropdown menu text uses Roboto.
            */
            font-family: "Roboto", Arial, Helvetica, sans-serif;

            /*
            First number = top and bottom spacing.
            Second number = left and right spacing.
            */
            padding: 17px 22px;

            color: black;
            text-decoration: none;

            border-bottom: 1px solid #d6d6d6;

            transition:
                background-color 0.2s ease,
                color 0.2s ease;
        }

        /*
        Changes a menu item when it is hovered or selected.
        */
            .dropdown a:hover,
            .dropdown a:focus {
            background-color: var(--banner-colour);
            color: white;
        }
.menu::after {
    content: "";
    position: absolute;
    top: var(--banner-height);
    left: 0;
    width: 230px;
    height: 12px;
}

        /*
        ============================================================
        MAIN HOMEPAGE AREA
        ============================================================
        */

        main {
            /*
            Stops the fixed banner covering the top of the page.
            */
            padding-top: calc(
                var(--banner-height)
                + var(--motif-strip-height)
            );
        }

        .hero {
            /*
            Gives the main section at least enough height to
            fill the screen beneath the fixed banner.
            */
            min-height: calc(
                100vh
                - var(--banner-height)
                - var(--motif-strip-height)
            );

            /*
            Controls the spacing around the homepage content.

            First number = top and bottom.
            Second number = left and right.
            */
            padding: 60px 30px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero-content {
            width: 100%;

            /*
            Maximum total width of the central homepage area.
            */
            max-width: 900px;

            text-align: center;
        }

        .main-image {
            display: block;

            width: 100%;

            /*
            Change this number to make the image's maximum
            displayed size larger or smaller.
            */
            max-width: 650px;

            /*
            Keeps the image's original shape.
            */
            height: auto;

            /*
            Centres the image.
            */
            margin: 0 auto;

            /*
            Border around the image.

            Delete this line if you do not want a border.
            */
            border: 2px solid var(--border-colour);
        }

        .introductory-text {
            /*
            Keeps the text the same maximum width as the image.
            */
            max-width: 650px;

            /*
            32px creates space above the text.
            auto centres it left and right.
            */
            margin: 32px auto 0;
        }

        .introductory-text h3 {
            margin-top: 0;
            margin-bottom: 14px;

            /*
            Change this number to make the heading larger
            or smaller.
            */
            font-size: 30px;

            font-weight: normal;
        }

        .introductory-text p {
            margin-top: 0;
            margin-bottom: 18px;

            /*
            Change this number to make paragraph text larger
            or smaller.
            */
            font-size: 18px;
        }

        /*
        Optional link beneath the introduction.
        */
        .text-link {
            color: var(--text-colour);
        }


        /*
        ============================================================
        INTERNAL PAGE LAYOUT
        ============================================================

        These styles are used for About, Blog, Writings and
        Miscellaneous.
        */

        .page-section {
            min-height: calc(
                100vh
                - var(--banner-height)
                - var(--motif-strip-height)
            );
            padding: 70px 30px;

            display: flex;
            justify-content: center;
        }

        .page-content {
            width: 100%;
            max-width: 760px;
        }

        #page-content:has(.blog-link-box) .page-section,
        #page-content:has(.site-log-scroll-box) .page-section {
            height: calc(
                100vh
                - var(--banner-height)
                - var(--motif-strip-height)
            );

            min-height: 0;
            overflow: hidden;
        }

        .page-content h2 {
            margin-top: 0;
            margin-bottom: 30px;

            font-size: 34px;
            font-weight: normal;
            letter-spacing: 1px;
        }

        .page-content h3 {
            margin-top: 35px;
            margin-bottom: 12px;

            font-size: 23px;
            font-weight: normal;
        }

        .page-content p,
        .page-content li {
            font-family: "Roboto", Arial, Helvetica, sans-serif;
            font-size: 18px;
            line-height: 1.8;
        }

        .page-content p {
            margin-top: 0;
            margin-bottom: 22px;
        }

        .page-content a {
            color: black;
        }

        /*
        Removes bullet symbols and left indentation from ordinary lists
        inside the website's internal content pages.
        */
        .page-content ul {
            list-style: none;
            padding-left: 0;
        }

        .post-date {
            font-size: 15px;
            font-style: italic;
        }


        /*
        ============================================================
        BLOG LIST AND BLOG POSTS
        ============================================================
        */

        .blog-list-item {
            padding: 0 0 30px;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--subtle-border-colour);
        }

        .blog-list-item:last-child {
            border-bottom: 0;
        }

        .blog-list-item h3 {
            margin-top: 0;
            margin-bottom: 8px;
        }

        .blog-list-item a {
            color: var(--text-colour);
        }

        .blog-post-navigation {
            margin-bottom: 28px;
        }

        .blog-post-navigation a {
            color: var(--text-colour);
        }

        .loading-message,
        .error-message {
            font-size: 17px;
        }

        /*
        ============================================================
        VIEWPORT-FITTED BLOG DIRECTORY
        ============================================================

        The Blog directory fills the remaining visible screen space.

        The box still scrolls with a mouse wheel, trackpad, keyboard
        or touch gesture, but its scrollbar remains hidden.
        */
        .blog-link-box {
            width: 100%;

            height: calc(
                100vh
                - var(--banner-height)
                - var(--motif-strip-height)
                - 220px
            );

            min-height: 180px;
            overflow-y: auto;
            overflow-x: hidden;
            padding-right: 12px;
            border: 0;
            background: transparent;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .blog-link-box::-webkit-scrollbar {
            display: none;
        }

        /*
        ============================================================
        CUSTOM SCROLL ARROWS
        ============================================================

        These replace the visible scrollbar with a small dark-grey
        up arrow and down arrow.
        */
        .scroll-area-wrapper {
            position: relative;
        }

        .scroll-arrow {
            position: absolute;
            right: -34px;

            width: 28px;
            height: 28px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0;

            border: 0;
            background: transparent;
            color: #2f2f2f;

            font-family: Arial, Helvetica, sans-serif;
            font-size: 22px;
            line-height: 1;

            cursor: pointer;
            z-index: 2;

            opacity: 0.9;
            transition: opacity 0.2s ease;
        }

        .scroll-arrow:hover,
        .scroll-arrow:focus-visible {
            opacity: 1;
        }

        .scroll-arrow-up {
            top: 0;
        }

        .scroll-arrow-down {
            bottom: 0;
        }

        .scroll-arrow:disabled {
            opacity: 0.18;
            cursor: default;
        }



        /*
        ============================================================
        VIEWPORT-FITTED SITE LOG
        ============================================================

        The Site Log fills the remaining visible screen space.

        It scrolls internally without showing a scrollbar.
        */
        .site-log-scroll-box {
            width: 100%;

            height: calc(
                100vh
                - var(--banner-height)
                - var(--motif-strip-height)
                - 265px
            );

            min-height: 180px;
            overflow-y: auto;
            overflow-x: hidden;
            padding-right: 12px;
            border: 0;
            background: transparent;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .site-log-scroll-box::-webkit-scrollbar {
            display: none;
        }

        .site-log-entry {
            padding-bottom: 26px;
            margin-bottom: 26px;
            border-bottom: 1px solid var(--subtle-border-colour);
        }

        .site-log-entry:last-child {
            border-bottom: 0;
        }

        .site-log-date {
            margin-bottom: 7px;
            font-size: 15px;
            font-style: italic;
        }

        .site-log-message {
            margin-bottom: 8px;
            font-size: 19px;
        }

        .site-log-back-link {
            margin-top: 24px;
            margin-bottom: 0;
        }



        /*
        ============================================================
        FOOTER
        ============================================================
        */

        /*
        Footer with a faded version of the motif image.

        Lower 0.62 to show more image.
        Raise 0.62 to make the image fainter.
        */
        .site-footer {
            min-height: var(--footer-motif-height);
            padding: 30px 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;
            font-size: 14px;

            background-image:
                linear-gradient(
                    rgba(255, 255, 255, 0.62),
                    rgba(255, 255, 255, 0.62)
                ),
                var(--motif-image);

            background-size: cover;
            background-position: center;

            border-top: 1px solid var(--subtle-border-colour);
        }

        .site-footer p {
            margin: 0;
            padding: 5px 10px;
            background-color: rgba(255, 255, 255, 0.30);
        }


        /*
        ============================================================
        MOBILE AND SMALL-SCREEN SETTINGS
        ============================================================

        These settings apply when the screen is 600px wide
        or smaller.
        */

        @media (max-width: 600px) {
            .top-banner {
                height: var(--mobile-banner-height);
            }

            .menu {
                height: var(--mobile-banner-height);
            }

            .menu-button {
                width: var(--mobile-banner-height);
                height: var(--mobile-banner-height);
            }

            .dropdown {
                top: var(--mobile-banner-height);

                /*
                Makes the dropdown easier to use on a phone.
                */
                width: min(260px, 85vw);
            }
            .menu::after {
    top: var(--mobile-banner-height);
    width: min(260px, 85vw);
}

            .site-title {
                font-size: 17px;
                letter-spacing: 2px;

                padding-left: 75px;
                padding-right: 20px;
            }

            .motif-strip {
                top: var(--mobile-banner-height);
                height: var(--mobile-motif-strip-height);
            }

            main {
                padding-top: calc(
                    var(--mobile-banner-height)
                    + var(--mobile-motif-strip-height)
                );
            }

            .hero {
                min-height: calc(
                    100vh
                    - var(--mobile-banner-height)
                    - var(--mobile-motif-strip-height)
                );

                padding: 40px 20px;
            }

            .introductory-text h3 {
                font-size: 25px;
            }

            .introductory-text p {
                font-size: 16px;
            }

            .page-section {
                min-height: calc(
                    100vh
                    - var(--mobile-banner-height)
                    - var(--mobile-motif-strip-height)
                );
                padding: 45px 20px;
            }

            .page-content h2 {
                font-size: 28px;
            }

            .page-content h3 {
                font-size: 21px;
            }

            .page-content p,
            .page-content li {
                font-size: 17px;
            }

            #page-content:has(.blog-link-box) .page-section,
            #page-content:has(.site-log-scroll-box) .page-section {
                height: calc(
                    100vh
                    - var(--mobile-banner-height)
                    - var(--mobile-motif-strip-height)
                );

                min-height: 0;
                overflow: hidden;
            }

            .blog-link-box {
                height: calc(
                    100vh
                    - var(--mobile-banner-height)
                    - var(--mobile-motif-strip-height)
                    - 155px
                );

                min-height: 150px;
                padding-right: 4px;
            }

            .site-log-scroll-box {
                height: calc(
                    100vh
                    - var(--mobile-banner-height)
                    - var(--mobile-motif-strip-height)
                    - 205px
                );

                min-height: 150px;
                padding-right: 4px;
            }

            .scroll-arrow {
                right: -2px;
                width: 30px;
                height: 30px;

                background-color: rgba(255, 255, 255, 0.78);
                border-radius: 50%;
            }

            .site-footer {
                min-height: 80px;
                padding: 24px 15px;
            }
        }


        /*
        ============================================================
        REDUCED MOTION SETTING
        ============================================================

        Some people configure their device to reduce animation.
        This respects that preference.
        */

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }

            *,
            *::before,
            *::after {
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <!--
    ============================================================
    FIXED TOP BANNER
    ============================================================
    -->

    <header class="top-banner">

        <!--
        HAMBURGER NAVIGATION

        aria-label describes the menu for screen readers.
        -->
        <nav
            class="menu"
            id="main-menu"
            aria-label="Main navigation"
        >

            <!--
            The three empty span elements create the three
            horizontal hamburger lines.

            Do not place words inside the span elements.
            -->
            <button
                class="menu-button"
                id="menu-button"
                type="button"
                aria-label="Open navigation menu"
                aria-expanded="false"
                aria-controls="dropdown-menu"
            >
                <span></span>
                <span></span>
                <span></span>
            </button>

            <!--
            ========================================================
            WEBSITE MENU LINKS
            ========================================================

            These links now point to internal sections of index.html.

            The visible words can still be changed between
            the opening and closing <a> tags.

            The data-page value identifies the content section.
            The data-title value controls the top-banner heading.
            -->

            <ul
                class="dropdown"
                id="dropdown-menu"
            >
                <!--
                Each link now points to an internal website section.

                href="#home"
                Changes the address in the browser.

                data-page="home"
                Tells JavaScript which content to display later.

                data-title="Mathew's Website"
                Tells JavaScript what text to show in the top banner.
                -->

                <li>
                    <a
                        href="#home"
                        data-page="home"
                        data-title="Mathew's Website"
                    >
                        Home
                    </a>
                </li>

                <li>
                    <a
                        href="#about"
                        data-page="about"
                        data-title="About Me"
                    >
                        About Me
                    </a>
                </li>

                <li>
                    <a
                        href="#blog"
                        data-page="blog"
                        data-title="Blog"
                    >
                        Blog
                    </a>
                </li>

                <li>
                    <a
                        href="#writings"
                        data-page="writings"
                        data-title="Writings"
                    >
                        Writings
                    </a>
                </li>

                <li>
                    <!--
                    The menu shows "Misc." while the fixed banner
                    displays "Miscellaneous".
                    -->
                    <a
                        href="#miscellaneous"
                        data-page="miscellaneous"
                        data-title="Miscellaneous"
                    >
                        Misc.
                    </a>
                </li>
            </ul>

        </nav>

        <!--
        WEBSITE TITLE

        Change only the words "Mathew's Website".

        The title is also a link back to the homepage.
        -->
        <h1 class="site-title">
            <a
                href="#home"
                id="site-title-text"
            >
                Mathew's Website
            </a>
        </h1>

    </header>

    <!-- Thin decorative image strip beneath the fixed banner -->
    <div
        class="motif-strip"
        aria-hidden="true"
    ></div>


    <!--
    ============================================================
    MAIN HOMEPAGE CONTENT
    ============================================================
    -->
    <main id="page-content">
        <section class="hero">

            <div class="hero-content">

                <!--
                ====================================================
                MAIN IMAGE
                ====================================================

    <script>
        /*
        ============================================================
        HAMBURGER MENU CONTROLS
        ============================================================

        This JavaScript makes the menu work properly when clicked
        or tapped.

        It also:

        - changes the hamburger icon into an X
        - closes the menu when a link is selected
        - closes the menu when clicking elsewhere
        - closes the menu when pressing Escape

        You generally do not need to edit this section.
        */

        const menu = document.getElementById("main-menu");
        const menuButton = document.getElementById("menu-button");
        const menuLinks = document.querySelectorAll("#dropdown-menu a");

        /*
        Elements used by the internal page system.
        */
        const pageContent = document.getElementById("page-content");
        const siteTitle = document.getElementById("site-title-text");

        /*
        Opens or closes the menu.
        */
        function toggleMenu() {
            const isOpen = menu.classList.toggle("is-open");

            menuButton.setAttribute(
                "aria-expanded",
                String(isOpen)
            );

            menuButton.setAttribute(
                "aria-label",
                isOpen
                    ? "Close navigation menu"
                    : "Open navigation menu"
            );
        }

        /*
        Closes the menu.
        */
        function closeMenu() {
            menu.classList.remove("is-open");

            menuButton.setAttribute(
                "aria-expanded",
                "false"
            );

            menuButton.setAttribute(
                "aria-label",
                "Open navigation menu"
            );
        }

        /*
        Opens or closes the menu when the hamburger button
        is clicked or tapped.
        */
        menuButton.addEventListener("click", toggleMenu);

        /*
        On desktop, closes the menu when the mouse leaves the entire
        hamburger/dropdown area. The existing CSS transition makes
        the dropdown fade away smoothly.
        */
        menu.addEventListener("mouseleave", function () {
            closeMenu();
        });

        /*
        Closes the menu after a navigation link is selected.
        */
        menuLinks.forEach(function (link) {
            link.addEventListener("click", function () {
                closeMenu();

                /*
                If the user selects the page they are already viewing,
                showPage runs directly because the hash will not change.
                */
                const pageName = link.dataset.page;

                if (window.location.hash === "#" + pageName) {
                    showPage(pageName);
                }
            });
        });

        /*
        Closes the menu when the user clicks somewhere else
        on the page.
        */
        document.addEventListener("click", function (event) {
            if (!menu.contains(event.target)) {
                closeMenu();
            }
        });

        /*
        Closes the menu when the Escape key is pressed.
        */
        document.addEventListener("keydown", function (event) {
            if (event.key === "Escape") {
                closeMenu();
                menuButton.focus();
            }
        });


        /*
        ============================================================
        INTERNAL PAGE AND BLOG SYSTEM
        ============================================================

        This changes only the main content and banner title.
        The fixed banner and hamburger menu remain in place.

        Blog information comes from blog-posts.json.
        Individual articles come from files inside the posts folder.
        */

        const pageTitles = {
            home: "Mathew's Website",
            about: "About Me",
            blog: "Blog",
            writings: "Writings",
            miscellaneous: "Miscellaneous",
            "site-log": "Site Log"
        };

        /*
        Stores the blog index after it has been loaded.
        */
        let blogPosts = [];

        /*
        Reads blog-posts.json.

        The JSON file controls the order, title, date, summary
        and file location of every blog post.
        */
        async function getBlogPosts() {
            if (blogPosts.length > 0) {
                return blogPosts;
            }

            const response = await fetch("blog-posts.json");

            if (!response.ok) {
                throw new Error("The blog index could not be loaded.");
            }

            blogPosts = await response.json();
            return blogPosts;
        }

        /*
        Converts posts/first-post.html into first-post.
        This is used in the browser address.
        */
        function getPostSlug(fileName) {
            return fileName
                .replace(/^posts\//, "")
                .replace(/\.html$/, "");
        }

        /*
        Returns information about the current browser address.

        Examples:

        #about
        becomes:
        { type: "page", page: "about" }

        #blog/first-post
        becomes:
        { type: "post", slug: "first-post" }
        */
        function getRouteFromHash() {
            const hash = window.location.hash.replace(/^#/, "");

            if (hash.startsWith("blog/")) {
                return {
                    type: "post",
                    slug: hash.slice("blog/".length)
                };
            }

            if (pageTitles[hash]) {
                return {
                    type: "page",
                    page: hash
                };
            }

            return {
                type: "page",
                page: "home"
            };
        }

        /*
        Updates the fixed banner and browser-tab title.
        */
        function updateTitles(pageName, postTitle = "") {
            if (postTitle) {
                siteTitle.textContent = "Blog";
                document.title =
                    postTitle + " | Mathew's Website";
                return;
            }

            siteTitle.textContent = pageTitles[pageName];

            document.title =
                pageName === "home"
                    ? "Mathew's Personal Website"
                    : pageTitles[pageName] +
                      " | Mathew's Website";
        }

        /*
        Displays the list of blog posts from blog-posts.json.
        */
        async function loadBlogList() {
            const blogList = document.getElementById("blog-list");

            if (!blogList) {
                return;
            }

            blogList.innerHTML =
                '<p class="loading-message">Loading blog posts...</p>';

            try {
                const posts = await getBlogPosts();

                /*
                Sorts blog posts newest-first.

                Every entry in blog-posts.json should contain:
                "dateISO": "YYYY-MM-DD"
                */
                posts.sort(function (a, b) {
                    return new Date(b.dateISO) - new Date(a.dateISO);
                });

                if (posts.length === 0) {
                    blogList.innerHTML =
                        "<p>No blog posts have been published yet.</p>";
                    return;
                }

                blogList.innerHTML = posts.map(function (post) {
                    const slug = getPostSlug(post.file);

                    return `
                        <article class="blog-list-item">
                            <h3>
                                <a href="#blog/${slug}">
                                    ${post.title}
                                </a>
                            </h3>

                            <p>
                                ${post.summary}
                            </p>
                        </article>
                    `;
                }).join("");
            } catch (error) {
                blogList.innerHTML = `
                    <p class="error-message">
                        The blog posts could not be loaded.
                    </p>
                `;

                console.error(error);
            }
        }

        /*
        ============================================================
        AUTOMATIC SITE LOG
        ============================================================

        This reads the public GitHub commit history for the website.

        Only commit messages beginning with SITE: are displayed.
        Example:
        SITE: Add automatic Site Log
        */

        const githubUsername = "kibaszott";
        const githubRepository = "kibaszott.github.io";

        /*
        Prevents GitHub commit text from being interpreted as HTML.
        */
        function escapeHtml(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        /*
        Formats GitHub's timestamp in Sydney time.

        Example:
        2 August 2026 · 10:04 am
        */
        function formatSiteLogDate(dateString) {
            return new Intl.DateTimeFormat("en-AU", {
                day: "numeric",
                month: "long",
                year: "numeric",
                hour: "numeric",
                minute: "2-digit",
                hour12: true,
                timeZone: "Australia/Sydney"
            })
                .format(new Date(dateString))
                .replace(",", " ·")
                .replace("am", "am")
                .replace("pm", "pm");
        }

        /*
        Loads up to 100 recent commits and keeps only SITE: entries.
        */
        async function loadSiteLog() {
            const siteLogList = document.getElementById("site-log-list");

            if (!siteLogList) {
                return;
            }

            siteLogList.innerHTML =
                '<p class="loading-message">Loading website updates...</p>';

            try {
                const apiUrl =
                    "https://api.github.com/repos/" +
                    githubUsername +
                    "/" +
                    githubRepository +
                    "/commits?per_page=100";

                const response = await fetch(apiUrl, {
                    headers: {
                        Accept: "application/vnd.github+json"
                    }
                });

                if (!response.ok) {
                    throw new Error(
                        "GitHub returned status " + response.status
                    );
                }

                const commits = await response.json();

                const siteCommits = commits.filter(function (item) {
                    const message =
                        item.commit &&
                        item.commit.message
                            ? item.commit.message.trim()
                            : "";

                    return message.startsWith("SITE:");
                });

                if (siteCommits.length === 0) {
                    siteLogList.innerHTML = `
                        <p>
                            No Site Log entries have been published yet.
                        </p>

                        <p>
                            New entries will appear after a GitHub commit
                            message begins with <strong>SITE:</strong>
                        </p>
                    `;
                    return;
                }

                siteLogList.innerHTML = siteCommits
                    .map(function (item) {
                        const fullMessage =
                            item.commit.message.trim();

                        /*
                        Uses only the first line and removes SITE:
                        from the visitor-facing message.
                        */
                        const displayMessage = fullMessage
                            .split("\n")[0]
                            .replace(/^SITE:\s*/, "");

                        const commitDate =
                            item.commit.committer &&
                            item.commit.committer.date
                                ? item.commit.committer.date
                                : item.commit.author.date;

                        return `
                            <article class="site-log-entry">
                                <p class="site-log-date">
                                    ${escapeHtml(
                                        formatSiteLogDate(commitDate)
                                    )}
                                </p>

                                <p class="site-log-message">
                                    ${escapeHtml(displayMessage)}
                                </p>

                            </article>
                        `;
                    })
                    .join("");
            } catch (error) {
                siteLogList.innerHTML = `
                    <p class="error-message">
                        The Site Log could not be loaded from GitHub.
                    </p>

                    <p>
                        Please try refreshing the page later.
                    </p>
                `;

                console.error(error);
            }
        }


        /*
        ============================================================
        CUSTOM SCROLL ARROW CONTROLS
        ============================================================
        */

        function updateScrollArrowStates(scrollArea) {
            const wrapper = scrollArea.closest(".scroll-area-wrapper");

            if (!wrapper) {
                return;
            }

            const upButton = wrapper.querySelector(
                '[data-scroll-direction="up"]'
            );

            const downButton = wrapper.querySelector(
                '[data-scroll-direction="down"]'
            );

            const tolerance = 2;

            if (upButton) {
                upButton.disabled =
                    scrollArea.scrollTop <= tolerance;
            }

            if (downButton) {
                downButton.disabled =
                    scrollArea.scrollTop +
                    scrollArea.clientHeight >=
                    scrollArea.scrollHeight - tolerance;
            }
        }

        function initialiseScrollArrows() {
            const arrowButtons =
                document.querySelectorAll(".scroll-arrow");

            arrowButtons.forEach(function (button) {
                const targetId = button.dataset.scrollTarget;
                const direction = button.dataset.scrollDirection;
                const scrollArea =
                    document.getElementById(targetId);

                if (!scrollArea) {
                    return;
                }

                button.addEventListener("click", function () {
                    const amount =
                        Math.max(180, scrollArea.clientHeight * 0.7);

                    scrollArea.scrollBy({
                        top: direction === "up"
                            ? -amount
                            : amount,
                        behavior: "smooth"
                    });
                });

                scrollArea.addEventListener("scroll", function () {
                    updateScrollArrowStates(scrollArea);
                });

                updateScrollArrowStates(scrollArea);
            });
        }


        /*
        Displays one of the main internal pages.
        */
        async function showPage(pageName) {
            const safePageName = pageTitles[pageName]
                ? pageName
                : "home";

            const template = document.getElementById(
                "page-" + safePageName
            );

            if (!template) {
                return;
            }

            pageContent.replaceChildren(
                template.content.cloneNode(true)
            );

            updateTitles(safePageName);

            window.scrollTo({
                top: 0,
                behavior: "auto"
            });

            closeMenu();

            if (safePageName === "blog") {
                await loadBlogList();
            }

            if (safePageName === "site-log") {
                await loadSiteLog();
            }

            initialiseScrollArrows();

            /*
            Re-checks the arrows after dynamic Blog or Site Log
            content has finished rendering.
            */
            requestAnimationFrame(function () {
                document
                    .querySelectorAll(
                        ".blog-link-box, .site-log-scroll-box"
                    )
                    .forEach(updateScrollArrowStates);
            });
        }

        /*
        Loads one separate blog article into the main content area.
        */
        async function showBlogPost(slug) {
            try {
                const posts = await getBlogPosts();

                const post = posts.find(function (item) {
                    return getPostSlug(item.file) === slug;
                });

                if (!post) {
                    throw new Error("The requested blog post was not found.");
                }

                pageContent.innerHTML = `
                    <section class="page-section">
                        <div class="page-content">
                            <nav class="blog-post-navigation">
                                <a href="#blog">
                                    &larr; Back to Blog
                                </a>
                            </nav>

                            <div id="loaded-blog-post">
                                <p class="loading-message">
                                    Loading blog post...
                                </p>
                            </div>
                        </div>
                    </section>
                `;

                updateTitles("blog", post.title);

                const response = await fetch(post.file);

                if (!response.ok) {
                    throw new Error("The blog article could not be loaded.");
                }

                const articleHtml = await response.text();

                document.getElementById(
                    "loaded-blog-post"
                ).innerHTML = articleHtml;

                window.scrollTo({
                    top: 0,
                    behavior: "auto"
                });

                closeMenu();
            } catch (error) {
                pageContent.innerHTML = `
                    <section class="page-section">
                        <div class="page-content">
                            <h2>Blog post unavailable</h2>

                            <p>
                                This blog post could not be loaded.
                            </p>

                            <p>
                                <a href="#blog">
                                    Return to the Blog
                                </a>
                            </p>
                        </div>
                    </section>
                `;

                updateTitles("blog");
                console.error(error);
            }
        }

        /*
        Opens the correct internal page whenever the address changes.
        This also makes the browser Back and Forward buttons work.
        */
        async function handleRoute() {
            const route = getRouteFromHash();

            if (route.type === "post") {
                await showBlogPost(route.slug);
                return;
            }

            await showPage(route.page);
        }

        window.addEventListener("hashchange", handleRoute);

        /*
        The banner title links back to Home.
        */
        siteTitle.addEventListener("click", function () {
            if (
                window.location.hash === "#home" ||
                window.location.hash === ""
            ) {
                showPage("home");
            }
        });

        /*
        Display the correct page when the website first opens.
        */
        handleRoute();


        /*
        ============================================================
        AUTOMATIC FOOTER YEAR
        ============================================================

        This inserts the current year into:

        <span id="current-year"></span>
        */

        document.getElementById("current-year").textContent =
            new Date().getFullYear();
    </script>
